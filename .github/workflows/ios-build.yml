name: iOS build

# 署名なしのipaを作る。SideStoreが、入れるときに署名し直す。
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

# ipa を「latest」のリリースに置くため、書き込みを許す
permissions:
  contents: write
  # 段2の成果物（artifact）を、キャッシュに無いときの代わりとして取るため
  actions: read

jobs:
  build:
    # iPhone Duo の内側画面いっぱいに出すには、iOS 27.1 以降の SDK でビルドする必要がある。
    # それより前の SDK では、内側画面で iPhone 用の枠（左右が黒）になる。Xcode 27 は xcode-27 のランナーにある
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # リモート本体のパッケージ（duo-remote リポジトリ）を隣に置く
      - uses: actions/checkout@v4
        with:
          repository: nexon1101-pixel/duo-remote
          path: vendor/duo-remote

      # キーボード本体のパッケージ（DuoFlick リポジトリ）を隣に置く
      - uses: actions/checkout@v4
        with:
          repository: nexon1101-pixel/DuoFlick
          path: vendor/DuoFlick

      # ---- Android（Kernarium）：デバッグ版だけが使う。本番のビルド手順には関係しない ----
      - name: Kernarium のピンを読む
        id: pin
        run: |
          ref=$(grep -E '^KERNARIUM_REF=' ios/kernarium.pin | head -n1 | cut -d= -f2)
          tag=$(grep -E '^KERNARIUM_RELEASE_TAG=' ios/kernarium.pin | head -n1 | cut -d= -f2)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::KERNARIUM_REF が不正です"; exit 1; }
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::KERNARIUM_RELEASE_TAG が不正です"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # android-runtime.yml のキャッシュキーと同じ形（作り直すときは両方の v1 を上げる）
          echo "key=${ref}-${tag}-v1" >> "$GITHUB_OUTPUT"

      # ソースだけ（GuestHost の Swift/ObjC とヘッダー、本元の埋め込みスクリプト）。ピンのコミット固定
      - uses: actions/checkout@v4
        with:
          repository: imxieyi/Kernarium
          ref: ${{ steps.pin.outputs.ref }}
          path: vendor/kernarium

      # 成果物（XCFramework 群とステージ済みイメージ）は、先にキャッシュから。
      # android-runtime.yml が成功時に保存する（artifact は保持3日で消えるので、正はキャッシュ）
      - name: 段2の成果物を復元（キャッシュ）
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/kernarium/.build/kernarium-xcframeworks
            vendor/kernarium/.build/andarium-system
          key: kernarium-products-${{ runner.os }}-${{ steps.pin.outputs.key }}

      # キャッシュに無いとき：android-runtime の直近の成功実行の artifact を使う（保持期間内のみ）
      - name: 段2の成果物を復元（artifact、キャッシュに無いとき）
        id: runtime-artifact
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          mkdir -p vendor/kernarium/.build
          for id in $(gh run list --workflow android-runtime.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name "android-runtime-$REF" --dir vendor/kernarium/.build; then
              echo "artifact を run $id から取りました"
              exit 0
            fi
          done
          echo "::error::android-runtime-$REF の artifact が見つかりません（保持期間切れの可能性）。android-runtime を実行し直してください"
          exit 1

      - name: Xcodeを選ぶ（入っている中でいちばん新しいもの）
        run: |
          ls -d /Applications/Xcode*.app
          best=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          test -n "$best" || { echo "::error::Xcode が見つかりません"; exit 1; }
          echo "using $best"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: XcodeGenを入れる
        run: brew install xcodegen

      - name: プロジェクトを作る
        working-directory: ios
        run: xcodegen generate

      - name: ビルドする
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoBox.xcodeproj \
            -scheme DuoBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              # 失敗したとき、エラーの行を注釈に出す
              grep -E "error:" build.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
              exit 1
            }

      # 成果物が復元できていなければ、本番のビルドが済んだあとで止める（本番のビルドは巻き込まない）
      - name: Android の成果物が揃っているか確かめる
        run: |
          B=vendor/kernarium/.build
          missing=0
          for p in KRuntime_Android_6_18_4K MesaEGL MesaGallium KosmicKrisp LibZstd; do
            [ -d "$B/kernarium-xcframeworks/$p.xcframework" ] || { echo "::error::$p.xcframework がありません"; missing=1; }
          done
          [ -d "$B/andarium-system" ] || { echo "::error::andarium-system がありません"; missing=1; }
          [ "$missing" = 0 ] || { echo "::error::段2の成果物を復元できませんでした（android-runtime を先に成功させてください）"; exit 1; }
          du -sh "$B/kernarium-xcframeworks" "$B/andarium-system"

      - name: デバッグ版をビルドする
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoBox.xcodeproj \
            -scheme DuoBoxDebug \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-debug.log || {
              grep -E "error:" build-debug.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
              exit 1
            }

      - name: デバッグ版の中身を確かめる（組み込み）
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/DuoBoxDebug.app
          ls "$APP/Frameworks" || true
          for f in KRuntime_Android_6_18_4K MesaEGL MesaGallium KosmicKrisp; do
            [ -d "$APP/Frameworks/$f.framework" ] || { echo "::error::$f.framework がアプリに入っていません"; exit 1; }
          done
          [ -d "$APP/andarium-system" ] || { echo "::error::andarium-system がアプリに入っていません"; exit 1; }
          du -sh "$APP"

      # 未署名ビルドには entitlements が付かない。SideStore が署名し直すときに読めるよう、擬似署名で埋める（デバッグ版だけ）
      - name: デバッグ版に entitlements を埋める（ldid）
        working-directory: ios
        run: |
          brew install ldid
          APP=build/Build/Products/Release-iphoneos/DuoBoxDebug.app
          ldid -SDuoBoxDebug/DuoBoxDebug.entitlements "$APP/DuoBoxDebug"
          ldid -e "$APP/DuoBoxDebug" | tee /tmp/ents.xml
          grep -q "kernel.increased-memory-limit" /tmp/ents.xml
          grep -q "kernel.extended-virtual-addressing" /tmp/ents.xml

      - name: 使ったSDKを確かめる
        working-directory: ios
        run: |
          PLIST=build/Build/Products/Release-iphoneos/DuoBox.app/Info.plist
          sdk=$(plutil -extract DTSDKName raw "$PLIST")
          echo "DTSDKName: $sdk / DTXcode: $(plutil -extract DTXcode raw "$PLIST")"
          # iphoneos27.1 より前なら、Duo の内側画面いっぱいには出ない
          ver=${sdk#iphoneos}
          if [ "$(printf '%s\n' 27.1 "$ver" | sort -V | head -1)" != "27.1" ]; then
            echo "::warning::SDK が $sdk です。Duo の内側画面いっぱいに出すには iphoneos27.1 以降が要ります"
          fi

      - name: ipaにまとめる
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DuoBox.app Payload/
          zip -qr DuoBox.ipa Payload
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DuoBoxDebug.app Payload/
          zip -qr DuoBoxDebug.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DuoBox-ipa
          path: |
            ios/DuoBox.ipa
            ios/DuoBoxDebug.ipa
          if-no-files-found: error

      # iPhoneの Safari から取りやすいよう、ipa を「latest」のリリースにも置く（毎回上書き）
      - name: ipaをリリースに置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "最新のビルド" --notes "最新のビルドの ipa（毎回上書き）" --target "$GITHUB_SHA"
          # GitHub 側の一時的な失敗（HTTP 500）があるので、何度かやり直す
          for i in 1 2 3 4 5 6; do
            if gh release upload latest ios/DuoBox.ipa ios/DuoBoxDebug.ipa --clobber; then
              exit 0
            fi
            echo "::warning::アップロードに失敗しました（$i 回目）。やり直します"
            sleep $((i * 15))
          done
          echo "::error::ipa をリリースに置けませんでした。実行結果の DuoBox-ipa から取れます"
          exit 1
