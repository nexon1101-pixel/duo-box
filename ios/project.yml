name: DuoBox
options:
  bundleIdPrefix: com.duoremote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # リモート本体のパッケージ。ビルド時に duo-remote リポジトリを vendor/duo-remote へ取得して使う
  DuoRemoteCore:
    path: ../vendor/duo-remote
  # キーボード本体のパッケージ。ビルド時に DuoFlick リポジトリを vendor/DuoFlick へ取得して使う
  DuoFlickKeyboardCore:
    path: ../vendor/DuoFlick
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.30.0"
    CURRENT_PROJECT_VERSION: "71"
targets:
  DuoBox:
    type: application
    platform: iOS
    sources:
      - DuoBox
    settings:
      base:
        # アプリのIDは DuoRemote 時代と同じ。今の DuoRemote に上書きでき、接続先やトークンが引き継がれる
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone Duo の内側画面で、iPhone用の枠（互換表示）にならないよう、iPadも入れる
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: DuoBox/Info.plist
      properties:
        CFBundleDisplayName: DuoBox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 同じネットワークにあるPCに接続するために使います
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: DuoRemoteCore
      - target: DuoBoxKeyboard
  # デバッグ版。専用のソース（DuoBoxDebug/）を持ち、中身を本番と別々に変えられる。
  # 作りは本番と同じで、IDとアイコンと色が違う。横に並べて入れられる
  DuoBoxDebug:
    type: application
    platform: iOS
    sources:
      - DuoBoxDebug
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app.debug
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: DuoBoxDebug/Info.plist
      properties:
        CFBundleDisplayName: DuoBox Debug
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 同じネットワークにあるPCに接続するために使います
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: DuoRemoteCore
      - target: DuoBoxKeyboardDebug
  # 同梱の DuoFlick キーボード拡張。本体は DuoFlickKeyboardCore パッケージ側にある
  DuoBoxKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardHost
      - path: ../vendor/DuoFlick/Keyboard/SkkDict
        type: folder
    dependencies:
      - package: DuoFlickKeyboardCore
    info:
      path: KeyboardHost/Info.plist
      properties:
        CFBundleDisplayName: DuoFlick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DuoFlickKeyboardHost
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
  # デバッグ版のキーボード拡張
  DuoBoxKeyboardDebug:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardHost
      - path: ../vendor/DuoFlick/Keyboard/SkkDict
        type: folder
    dependencies:
      - package: DuoFlickKeyboardCore
    info:
      path: KeyboardHostDebug/Info.plist
      properties:
        CFBundleDisplayName: DuoFlick Debug
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DuoFlickKeyboardHost
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app.debug.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
