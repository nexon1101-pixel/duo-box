name: DuoBox
options:
  bundleIdPrefix: com.duoremote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # リモート本体のパッケージ。ビルド時に duo-remote リポジトリを vendor/duo-remote へ取得して使う
  DuoRemoteCore:
    path: ../vendor/duo-remote
  # キーボード本体のパッケージ。ビルド時に DuoFlick リポジトリを vendor/DuoFlick へ取得して使う
  DuoFlickKeyboardCore:
    path: ../vendor/DuoFlick
  # Android（Kernarium）の共有ホスト部品。DuoBoxDebug だけが使う。ビルド時に Kernarium を vendor/kernarium へ取得して使う
  GuestHostCore:
    path: ../vendor/kernarium/GuestHost/Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.30.0"
    CURRENT_PROJECT_VERSION: "73"
targets:
  DuoBox:
    type: application
    platform: iOS
    sources:
      - DuoBox
    settings:
      base:
        # アプリのIDは DuoRemote 時代と同じ。今の DuoRemote に上書きでき、接続先やトークンが引き継がれる
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone Duo の内側画面で、iPhone用の枠（互換表示）にならないよう、iPadも入れる
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: DuoBox/Info.plist
      properties:
        CFBundleDisplayName: DuoBox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 同じネットワークにあるPCに接続するために使います
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: DuoRemoteCore
      - target: DuoBoxKeyboard
  # デバッグ版。専用のソース（DuoBoxDebug/）を持つ、今は中身を入れていない箱だけのアプリ。
  # 作りは本番と同じで、IDとアイコンと色が違う。横に並べて入れられる
  DuoBoxDebug:
    type: application
    platform: iOS
    sources:
      - DuoBoxDebug
      # Kernarium 共有ホスト（GuestHost）。本元は「各アプリがそのまま取り込む」作り。コピーせず vendor を指す
      - path: ../vendor/kernarium/GuestHost/Sources
        type: group
      # ステージ済みシステムイメージ（段2の成果物）。フォルダ参照でバンドルへそのままコピーする。本元と同じ名前（andarium-system）
      # 無いときも xcodegen は通し（本番ビルドを巻き込まない）、CI 側の確認ステップで止める
      - path: ../vendor/kernarium/.build/andarium-system
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app.debug
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # 本元の GuestHostCore と Kernarium の框架は iOS 27.0 以上が前提（Package.swift の platforms）。デバッグ版だけ上げる
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        # 本元 Andarium と同じ Swift/C++ 設定（GuestHost/README が両アプリで揃える前提）
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: DuoBoxDebug/DuoBoxDebug-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_ENABLE_OBJC_ARC: "YES"
        # embed-device-framework.sh を走らせるため
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../vendor/kernarium/.build/kernarium-xcframeworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        # 増量メモリ上限と拡張仮想アドレス（本元 Andarium.entitlements と同じ2つ）。
        # 未署名ビルドでは付かないので、ios-build.yml で ldid による擬似署名で埋める
        CODE_SIGN_ENTITLEMENTS: DuoBoxDebug/DuoBoxDebug.entitlements
    dependencies:
      - package: GuestHostCore
      # 本元 Andarium と同じ扱い：ランタイム側は埋め込みだけ（リンクせず、ローダーが dlopen する）
      - framework: ../vendor/kernarium/.build/kernarium-xcframeworks/KRuntime_Android_6_18_4K.xcframework
        link: false
        embed: true
        codeSign: true
      - framework: ../vendor/kernarium/.build/kernarium-xcframeworks/MesaEGL.xcframework
        link: false
        embed: true
        codeSign: true
      - framework: ../vendor/kernarium/.build/kernarium-xcframeworks/MesaGallium.xcframework
        link: false
        embed: true
        codeSign: true
      # ZstdUtil.swift が import するのでリンクする（本元もリンクのみ）
      - framework: ../vendor/kernarium/.build/kernarium-xcframeworks/LibZstd.xcframework
        link: true
        embed: false
    postBuildScripts:
      # KosmicKrisp は実機専用なので、本元の埋め込みスクリプトで入れる
      - name: Embed KosmicKrisp (device only)
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          /bin/sh "$SRCROOT/../vendor/kernarium/Kernarium/scripts/embed-device-framework.sh" "$SRCROOT/../vendor/kernarium/.build/kernarium-xcframeworks/KosmicKrisp.xcframework"
      # UmlArm64Aot は、Android ランタイムが使うときだけ作られる
      - name: Embed UmlArm64Aot (when packaged)
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          # ピン（1.0b15）の embed-device-framework.sh は --optional 未対応（main 先頭で追加された）。
          # 有無の判定はこちらでやる
          XCF="$SRCROOT/../vendor/kernarium/.build/kernarium-xcframeworks/UmlArm64Aot.xcframework"
          if [ -d "$XCF" ]; then
            /bin/sh "$SRCROOT/../vendor/kernarium/Kernarium/scripts/embed-device-framework.sh" "$XCF"
          fi
    info:
      path: DuoBoxDebug/Info.plist
      properties:
        CFBundleDisplayName: DuoBox Debug
        UILaunchScreen: {}
        # 本元 Andarium/Config/Info.plist と同じキー（キー名だけ。ゲストの描画は Metal 4 前提）
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Android への接続をパソコンから受け付けるために使います
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # 同梱の DuoFlick キーボード拡張。本体は DuoFlickKeyboardCore パッケージ側にある
  DuoBoxKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardHost
      - path: ../vendor/DuoFlick/Keyboard/SkkDict
        type: folder
    dependencies:
      - package: DuoFlickKeyboardCore
    info:
      path: KeyboardHost/Info.plist
      properties:
        CFBundleDisplayName: DuoFlick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DuoFlickKeyboardHost
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoremote.app.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
